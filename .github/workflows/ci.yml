name: PVL CI

on:
  push:
    branches: [main, pvl-1b-solver-poc]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Gmsh and GetDP
        run: |
          sudo apt-get update
          sudo apt-get install -y gmsh getdp
          gmsh -version
          getdp -version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: python -m pytest -ra

      - name: Generate analytical POC artifact
        run: python -m pvl.cli.main poc001 --output results/poc001
