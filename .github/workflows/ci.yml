name: PVL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Complete-Rig FEM convergence is intentionally expensive. A newer commit on the same branch
# supersedes the numerical evidence from an older commit, so do not burn runner time finishing
# obsolete meshes/solves. Different branches/PRs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Gmsh and GetDP
        run: |
          sudo apt-get update
          sudo apt-get install -y gmsh getdp
          gmsh -version
          getdp -version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev,api]'

      - name: Test
        run: python -m pytest -ra

      - name: Generate complete-Rig exploratory mesh
        run: python -m pvl.cli.rig_mesh --output results/rig_mesh_smoke

      - name: Run complete-Rig exploratory DC magnetostatic smoke
        run: python -m pvl.cli.rig_dc --output results/rig_dc_smoke

      - name: Run complete-Rig DC mesh and air-domain convergence
        run: python -m pvl.cli.rig_dc_convergence --output results/rig_dc_convergence

      - name: Generate analytical POC-001 artifact
        run: python -m pvl.cli.main poc001 --output results/poc001

      - name: Run single-coil POC-001 validation
        run: python -m pvl.cli.main poc001-fem --output results/poc001_fem

      - name: Run independent dual-coil POC-002 validation
        run: python -m pvl.cli.main poc002-fem --output results/poc002_fem

      - name: Run phase and signed-frequency POC-003 validation
        run: python -m pvl.cli.main poc003-phase --output results/poc003_phase

      - name: Run eddy-current slab POC-004 validation
        run: python -m pvl.cli.main poc004-eddy --output results/poc004_eddy

      - name: Run dual-coil conductive-insert POC-005 validation
        run: python -m pvl.cli.main poc005-insert --output results/poc005_insert

      - name: Upload PVL validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvl-validation-evidence
          path: results/
          if-no-files-found: warn

  frontend-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
