name: PVL CI

on:
  push:
    branches: [main, pvl-1b-solver-poc]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
      - name: Generate analytical POC artifact
        run: python -m pvl.cli.main poc001 --output results/poc001
